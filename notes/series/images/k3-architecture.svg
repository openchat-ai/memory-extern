  <rect x="380" y="410" width="280" height="160" rx="10" fill="white" stroke="#E67E22" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">Trunk（每 token 必经）</text>

  <rect x="395" y="450" width="130" height="25" rx="4" fill="#FDEBD0"/>
  <text x="460" y="467" text-anchor="middle" font-size="10" fill="#E67E22">KDA 门控投影</text>

  <rect x="535" y="450" width="130" height="25" rx="4" fill="#FDEBD0"/>
  <text x="600" y="467" text-anchor="middle" font-size="10" fill="#E67E22">Gated MLA Q/K/V/O</text>

  <rect x="395" y="485" width="130" height="25" rx="4" fill="#FDEBD0"/>
  <text x="460" y="502" text-anchor="middle" font-size="10" fill="#E67E22">2 共享专家</text>

  <rect x="535" y="485" width="130" height="25" rx="4" fill="#FDEBD0"/>
  <text x="600" y="502" text-anchor="middle" font-size="10" fill="#E67E22">Router + Dense + Embed</text>

  <rect x="395" y="525" width="270" height="30" rx="5" fill="#E74C3C"/>
  <text x="530" y="545" text-anchor="middle" font-size="11" font-weight="bold" fill="white">每 token 必经 · 无法稀疏化 · 108.8 GB</text>

  <!-- === Stats badge (bottom right) === -->
  <rect x="380" y="590" width="280" height="80" rx="10" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="520" y="615" text-anchor="middle" font-size="13" font-weight="bold" fill="#F1C40F">实测数据</text>
  <text x="395" y="638" font-size="10" fill="#ECF0F1">专家流量/token: 25.83 GB</text>
  <text x="395" y="655" font-size="10" fill="#ECF0F1">Trunk 流量/token: 108.8 GB (未量化)</text>
  <text x="395" y="672" font-size="10" fill="#ECF0F1">Trunk 量化后: 36 GB → 总计 61.8 GB</text>
  <text x="530" y="638" font-size="10" fill="#ECF0F1">缓存命中率: 35.3%</text>
  <text x="530" y="655" font-size="10" fill="#ECF0F1">路由 Zipf α: 0.279</text>
  <text x="530" y="672" font-size="10" fill="#ECF0F1">触及池子: 12.14%</text>

  <!-- === Legend === -->
  <rect x="700" y="100" width="280" height="200" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
  <text x="840" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">图例</text>

  <rect x="720" y="140" width="20" height="14" rx="3" fill="url(#g1)"/>
  <text x="750" y="152" font-size="11" fill="#2C3E50">KDA（线性注意力）</text>

  <rect x="720" y="165" width="20" height="14" rx="3" fill="url(#g2)"/>
  <text x="750" y="177" font-size="11" fill="#2C3E50">Gated MLA（标准注意力）</text>

  <rect x="720" y="190" width="20" height="14" rx="3" fill="url(#g3)"/>
  <text x="750" y="202" font-size="11" fill="#2C3E50">SiTU-GLU 激活</text>

  <line x1="720" y1="222" x2="740" y2="222" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="750" y="226" font-size="11" fill="#2C3E50">AttnRes 检索路径</text>

  <rect x="720" y="240" width="20" height="14" rx="3" fill="#9B59B6"/>
  <text x="750" y="252" font-size="11" fill="#2C3E50">共享专家（每 token 激活）</text>

  <rect x="720" y="265" width="20" height="14" rx="3" fill="#3498DB"/>
  <text x="750" y="277" font-size="11" fill="#2C3E50">路由专家（top-16 选中）</text>

  <rect x="700" y="330" width="280" height="140" rx="10" fill="#FFF3CD" stroke="#F39C12" stroke-width="1" filter="url(#shadow)"/>
  <text x="840" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">核心发现</text>
  <text x="715" y="378" font-size="11" fill="#856404">1. KDA 循环状态 → 常驻 SRAM</text>
  <text x="715" y="398" font-size="11" fill="#856404">2. AttnRes block 摘要 → 仅 56 KB</text>
  <text x="715" y="418" font-size="11" fill="#856404">3. Trunk 税 108.8GB → 量化后 36GB</text>
  <text x="715" y="438" font-size="11" fill="#856404">4. 缓存 1GB → 35.3% 命中率</text>
  <text x="715" y="458" font-size="11" fill="#856404">5. 路由 90% 重复 → 预取有效</text>

  <!-- Source label -->
  <text x="500" y="695" text-anchor="middle" font-size="9" fill="#BDC3C7">k3-verdict.md · independent-stack.md · batch_traffic_model.py</text>
</svg>
