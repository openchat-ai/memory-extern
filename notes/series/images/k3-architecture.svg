  <rect x="395" y="245" width="280" height="80" rx="6" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="535" y="268" text-anchor="middle" font-size="11" fill="#2C3E50">单专家结构</text>
  <text x="405" y="288" font-size="10" fill="#5D6D7E">w1 [3072, 7168] + w2 [3584, 6144] + w3 [3072, 7168]</text>
  <text x="405" y="305" font-size="10" fill="#E74C3C" font-weight="bold">MXFP4 QAT · 17.55 MB/层</text>

  <!-- Activation -->
  <rect x="395" y="335" width="280" height="30" rx="5" fill="#27AE60"/>
  <text x="535" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="white">SiTU-GLU 激活（非 GELU）</text>

