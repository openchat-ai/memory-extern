  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- === MoE Expert detail (right side) === -->
  <rect x="380" y="100" width="280" height="280" rx="10" fill="white" stroke="#3498DB" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">每层 MoE 细节</text>

  <!-- Router -->
  <rect x="400" y="140" width="240" height="35" rx="6" fill="#F39C12"/>
  <text x="520" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Router (Quantile Balancing)</text>

  <!-- Arrow from router to experts -->
