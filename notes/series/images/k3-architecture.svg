  <!-- Layer count badge -->
  <rect x="30" y="85" width="200" height="560" rx="10" fill="none" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#95A5A6">93 层</text>

  <!-- === Layer blocks === -->

  <!-- Block 1: Layer 1-12 (KDA) -->
  <rect x="60" y="120" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="163" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 1-12</text>

  <!-- Block 2: Layer 13-24 (KDA) -->
  <rect x="60" y="195" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="238" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 13-24</text>

  <!-- Block 3: Layer 25-36 (KDA) -->
  <rect x="60" y="270" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="313" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 25-36</text>

  <!-- Block 4: Layer 37-48 (Gated MLA) -->
  <rect x="60" y="345" width="140" height="60" rx="8" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="130" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Gated MLA</text>
  <text x="130" y="388" text-anchor="middle" font-size="10" fill="#FADBD8">Layer 37-48</text>

  <!-- Block 5: Layer 49-60 (KDA) -->
  <rect x="60" y="420" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="463" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 49-60</text>

  <!-- Block 6: Layer 61-72 (KDA) -->
  <rect x="60" y="495" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="538" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 61-72</text>

  <!-- Block 7: Layer 73-84 (KDA) -->
  <rect x="60" y="570" width="140" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="130" y="595" text-anchor="middle" font-size="13" font-weight="bold" fill="white">KDA</text>
  <text x="130" y="613" text-anchor="middle" font-size="10" fill="#D6EAF8">Layer 73-84</text>

