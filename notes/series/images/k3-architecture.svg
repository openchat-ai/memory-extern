  <text x="445" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="white">2 共享专家</text>

  <!-- Routed experts -->
  <rect x="505" y="195" width="130" height="30" rx="5" fill="#3498DB"/>
  <text x="570" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="white">896 路由专家</text>

  <!-- Top-16 -->
  <rect x="645" y="195" width="30" height="30" rx="5" fill="#1ABC9C"/>
  <text x="660" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="white">↑16</text>

