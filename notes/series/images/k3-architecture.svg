  <line x1="130" y1="180" x2="130" y2="195" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="130" y1="255" x2="130" y2="270" stroke="#E74C3C" stroke-width="2"/>
  <line x1="130" y1="330" x2="130" y2="345" stroke="#E74C3C" stroke-width="2"/>
  <line x1="130" y1="405" x2="130" y2="420" stroke="#E74C3C" stroke-width="2"/>
  <line x1="130" y1="480" x2="130" y2="495" stroke="#E74C3C" stroke-width="2"/>
  <line x1="130" y1="555" x2="130" y2="570" stroke="#E74C3C" stroke-width="2"/>
  <line x1="130" y1="630" x2="130" y2="645" stroke="#E74C3C" stroke-width="2"/>

  <!-- AttnRes label -->
  <rect x="220" y="300" width="90" height="28" rx="6" fill="#E74C3C"/>
  <text x="265" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AttnRes</text>

  <!-- AttnRes curved arrows -->
  <path d="M 210,310 C 195,280 195,250 170,240" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 210,310 C 195,350 195,400 170,410" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 210,310 C 240,260 270,200 280,180" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 210,310 C 240,380 270,480 280,520" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>

