<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="monospace">
  <defs>
    <linearGradient id="codebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Window frame -->
  <rect width="700" height="400" rx="12" fill="url(#codebg)" filter="url(#sh)"/>

  <!-- Title bar -->
  <rect width="700" height="36" rx="12" fill="#313244"/>
  <rect y="12" width="700" height="24" fill="#313244"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>

  <!-- Filename -->
  <text x="350" y="23" text-anchor="middle" font-size="12" fill="#6c7086">activation_vec.v — SiTU-GLU 激活函数</text>

  <!-- Line numbers + code -->
  <g font-size="13" fill="#cdd6f4">
    <!-- Line numbers -->
    <text x="30" y="65" fill="#585b70">1</text>
    <text x="30" y="85" fill="#585b70">2</text>
    <text x="30" y="105" fill="#585b70">3</text>
    <text x="30" y="125" fill="#585b70">4</text>
    <text x="30" y="145" fill="#585b70">5</text>
    <text x="30" y="165" fill="#585b70">6</text>
    <text x="30" y="185" fill="#585b70">7</text>
    <text x="30" y="205" fill="#585b70">8</text>
    <text x="30" y="225" fill="#585b70">9</text>
    <text x="30" y="245" fill="#585b70">10</text>
    <text x="30" y="265" fill="#585b70">11</text>
    <text x="30" y="285" fill="#585b70">12</text>
    <text x="30" y="305" fill="#585b70">13</text>
    <text x="30" y="325" fill="#585b70">14</text>
    <text x="30" y="345" fill="#585b70">15</text>
    <text x="30" y="365" fill="#585b70">16</text>
    <text x="30" y="385" fill="#585b70">17</text>

    <!-- Code -->
    <text x="55" y="65" fill="#cba6f7">module</text> <text x="120" y="65" fill="#89b4fa">activation_vec</text><text x="260" y="65" fill="#cdd6f4">#(</text>

    <text x="55" y="85" fill="#cba6f7">  parameter</text> <text x="175" y="85" fill="#89b4fa">NUM_LANES</text> <text x="280" y="85" fill="#cdd6f4">=</text> <text x="300" y="85" fill="#fab387">128</text>

    <text x="55" y="105" fill="#cba6f7">)</text><text x="65" y="105" fill="#cdd6f4">(</text>

    <text x="55" y="135" fill="#6c7086">// ── SiTU(x) = x · sigmoid(x) ──</text>

    <text x="55" y="165" fill="#6c7086">// sigmoid 分段近似：</text>
    <text x="55" y="185" fill="#6c7086">//   x &lt; -4  → 0</text>
    <text x="55" y="205" fill="#6c7086">//   x &gt;  4  → 1</text>
    <text x="55" y="225" fill="#6c7086">//   else    → (x+4)/8</text>

    <text x="55" y="255" fill="#cba6f7">task</text> <text x="100" y="255" fill="#89dceb">auto_situ</text><text x="200" y="255" fill="#cdd6f4">;</text>

    <text x="55" y="285" fill="#cba6f7">  if</text><text x="85" y="285" fill="#cdd6f4">(x_abs &lt; </text><text x="195" y="285" fill="#fab387">4</text><text x="210" y="285" fill="#cdd6f4">)</text>
    <text x="220" y="285" fill="#cdd6f4">→ </text><text x="245" y="285" fill="#a6e3a1">直接输出</text>

    <text x="55" y="315" fill="#cba6f7">  else if</text><text x="135" y="315" fill="#cdd6f4">(x_abs &gt; </text><text x="260" y="315" fill="#fab387">4</text><text x="275" y="315" fill="#cdd6f4">)</text>
    <text x="285" y="315" fill="#cdd6f4">→ </text><text x="310" y="315" fill="#f38ba8">饱和 0x7F</text>

    <text x="55" y="345" fill="#cba6f7">  else</text>
    <text x="110" y="345" fill="#cdd6f4">→ (x+</text><text x="175" y="345" fill="#fab387">4</text><text x="190" y="345" fill="#cdd6f4">)/</text><text x="210" y="345" fill="#fab387">8</text>
    <text x="230" y="345" fill="#cdd6f4">  </text><text x="250" y="345" fill="#a6e3a1">一次加法 + 一次右移</text>

    <text x="55" y="385" fill="#cba6f7">endtask</text>

    <!-- Highlight box -->
    <rect x="420" y="130" width="250" height="120" rx="8" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1"/>
    <text x="545" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#f38ba8">资源占用</text>
    <text x="435" y="178" font-size="11" fill="#cdd6f4">DSP:   </text><text x="505" y="178" font-size="11" fill="#a6e3a1" font-weight="bold">0</text>
    <text x="435" y="198" font-size="11" fill="#cdd6f4">LUT:   </text><text x="505" y="198" font-size="11" fill="#a6e3a1" font-weight="bold">~50/通道</text>
    <text x="435" y="218" font-size="11" fill="#cdd6f4">BRAM:  </text><text x="505" y="218" font-size="11" fill="#a6e3a1" font-weight="bold">0</text>
    <text x="435" y="238" font-size="11" fill="#cdd6f4">延迟:  </text><text x="505" y="238" font-size="11" fill="#a6e3a1" font-weight="bold">2 周期</text>
  </g>
</svg>
