<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="monospace">
  <defs>
    <linearGradient id="codebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="700" height="320" rx="12" fill="url(#codebg)" filter="url(#sh)"/>

  <rect width="700" height="36" rx="12" fill="#313244"/>
  <rect y="12" width="700" height="24" fill="#313244"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="350" y="23" text-anchor="middle" font-size="12" fill="#6c7086">MXFP4 2-bit 解码器 — FPGA 实现</text>

  <g font-size="13" fill="#cdd6f4">
    <text x="50" y="65" font-size="15" font-weight="bold" fill="#cba6f7">MXFP4 解码原理</text>

    <!-- Input -->
    <rect x="40" y="80" width="150" height="45" rx="6" fill="#89b4fa" fill-opacity="0.15" stroke="#89b4fa" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-size="11" fill="#89b4fa" font-weight="bold">输入: 1 字节</text>
    <text x="115" y="117" text-anchor="middle" font-size="10" fill="#6c7086">4 × 2-bit 索引</text>

    <!-- Arrow -->
    <line x1="195" y1="102" x2="230" y2="102" stroke="#6c7086" stroke-width="2"/>
    <polygon points="230,97 240,102 230,107" fill="#6c7086"/>

    <!-- LUT -->
    <rect x="240" y="70" width="200" height="65" rx="8" fill="#f9e2af" fill-opacity="0.12" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="340" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#f9e2af">256 × 4 LUT</text>
    <text x="340" y="110" text-anchor="middle" font-size="10" fill="#6c7086">组合逻辑，0 流水延迟</text>
    <text x="340" y="125" text-anchor="middle" font-size="10" fill="#a6e3a1">4 路并行查表</text>

    <!-- Arrow -->
    <line x1="445" y1="102" x2="480" y2="102" stroke="#6c7086" stroke-width="2"/>
    <polygon points="480,97 490,102 480,107" fill="#6c7086"/>

    <!-- Output -->
    <rect x="490" y="80" width="180" height="45" rx="6" fill="#a6e3a1" fill-opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
    <text x="580" y="100" text-anchor="middle" font-size="11" fill="#a6e3a1" font-weight="bold">输出: 4 × MXFP4</text>
    <text x="580" y="117" text-anchor="middle" font-size="10" fill="#6c7086">乘以 shared scale</text>

    <!-- Stats -->
    <rect x="40" y="155" width="210" height="100" rx="8" fill="#313244" stroke="#6c7086" stroke-width="1"/>
    <text x="145" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#cba6f7">资源占用</text>
    <text x="55" y="200" font-size="11" fill="#cdd6f4">LUT:  </text><text x="115" y="200" font-size="11" fill="#a6e3a1" font-weight="bold">1024</text>
    <text x="55" y="218" font-size="11" fill="#cdd6f4">DSP:  </text><text x="115" y="218" font-size="11" fill="#a6e3a1" font-weight="bold">0</text>
    <text x="55" y="236" font-size="11" fill="#cdd6f4">BRAM: </text><text x="120" y="236" font-size="11" fill="#a6e3a1" font-weight="bold">0</text>
    <text x="55" y="254" font-size="11" fill="#cdd6f4">延迟: </text><text x="120" y="254" font-size="11" fill="#a6e3a1" font-weight="bold">0 周期</text>

    <!-- Comparison -->
    <rect x="280" y="155" width="390" height="100" rx="8" fill="#313244" stroke="#6c7086" stroke-width="1"/>
    <text x="475" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#cba6f7">存储密度对比</text>
    <text x="295" y="200" font-size="11" fill="#f38ba8">bf16: 16 bit/参数</text>
    <text x="295" y="218" font-size="11" fill="#a6e3a1" font-weight="bold">MXFP4: 2.12 bit/参数</text>
    <text x="295" y="245" font-size="13" fill="#f9e2af" font-weight="bold">密度提升: 7.5 倍</text>

    <!-- Bottom highlight -->
    <rect x="40" y="275" width="620" height="35" rx="6" fill="#a6e3a1" fill-opacity="0.08"/>
    <text x="350" y="298" text-anchor="middle" font-size="13" fill="#a6e3a1" font-weight="bold">1024 LUT → 喂饱 128 路 SIMD MAC 阵列</text>
  </g>
</svg>
