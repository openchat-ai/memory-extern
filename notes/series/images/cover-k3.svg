<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#e74c3c" flood-opacity="0.3"/>
    </filter>
    <filter id="glowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bg)" rx="0"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="white" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="383"/><line x1="200" y1="0" x2="200" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/><line x1="400" y1="0" x2="400" y2="383"/>
    <line x1="500" y1="0" x2="500" y2="383"/><line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="700" y1="0" x2="700" y2="383"/><line x1="800" y1="0" x2="800" y2="383"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="750" cy="100" r="120" fill="none" stroke="#3498db" stroke-width="1" opacity="0.15"/>
  <circle cx="750" cy="100" r="80" fill="none" stroke="#3498db" stroke-width="1" opacity="0.1"/>
  <circle cx="150" cy="320" r="100" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.12"/>
  <circle cx="150" cy="320" r="60" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.08"/>

  <!-- Data flow lines -->
  <g stroke="#3498db" stroke-width="1.5" opacity="0.2" stroke-dasharray="8,4">
    <path d="M 50,200 Q 200,150 350,200 T 650,180 T 900,200"/>
    <path d="M 50,220 Q 200,270 350,220 T 650,240 T 900,220"/>
  </g>

  <!-- Main title -->
  <text x="450" y="140" text-anchor="middle" font-size="42" font-weight="bold" fill="white" filter="url(#glowFilter)">
    <tspan>Kimi K3</tspan>
  </text>
  <text x="450" y="185" text-anchor="middle" font-size="28" fill="#ecf0f1" filter="url(#glowFilter)">
    <tspan>技术深度解析</tspan>
  </text>

  <!-- Subtitle -->
  <text x="450" y="230" text-anchor="middle" font-size="16" fill="#bdc3c7">
    <tspan>2.8T 参数 · 104B 激活 · 896 专家 · 100 万上下文</tspan>
  </text>

  <!-- Highlight tags -->
  <g transform="translate(450, 270)">
    <rect x="-260" y="-15" width="110" height="28" rx="14" fill="#e74c3c" opacity="0.9"/>
    <text x="-205" y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="white">KDA</text>

    <rect x="-130" y="-15" width="110" height="28" rx="14" fill="#3498db" opacity="0.9"/>
    <text x="-75" y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SiTU-GLU</text>

    <rect x="0" y="-15" width="120" height="28" rx="14" fill="#27ae60" opacity="0.9"/>
    <text x="60" y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MXFP4 QAT</text>

    <rect x="140" y="-15" width="120" height="28" rx="14" fill="#f39c12" opacity="0.9"/>
    <text x="200" y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AttnRes</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="370" width="900" height="3" fill="url(#glow)"/>

  <!-- Author badge -->
  <rect x="30" y="340" width="180" height="30" rx="15" fill="white" opacity="0.1"/>
  <text x="120" y="360" text-anchor="middle" font-size="12" fill="#bdc3c7">StreamMoE Research</text>
</svg>
