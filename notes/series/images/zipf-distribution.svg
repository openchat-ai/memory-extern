<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2471A3"/>
    </linearGradient>
    <linearGradient id="cumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="sh" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#F8F9FA" rx="10"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">专家访问频率分布（Zipf 拟合）</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#7F8C8D">100K 真实路由请求 · α = 0.279 · 触及池子 12.14%</text>

  <!-- Axes -->
  <line x1="70" y1="70" x2="70" y2="410" stroke="#BDC3C7" stroke-width="1.5"/>
  <line x1="70" y1="410" x2="760" y2="410" stroke="#BDC3C7" stroke-width="1.5"/>

  <!-- Secondary Y axis (cumulative %) -->
  <line x1="760" y1="70" x2="760" y2="410" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Grid lines -->
  <g stroke="#ECF0F1" stroke-width="0.8">
    <line x1="70" y1="140" x2="760" y2="140"/>
    <line x1="70" y1="210" x2="760" y2="210"/>
    <line x1="70" y1="280" x2="760" y2="280"/>
    <line x1="70" y1="350" x2="760" y2="350"/>
  </g>

  <!-- Left Y axis labels (frequency) -->
  <g font-size="10" fill="#7F8C8D" text-anchor="end">
    <text x="62" y="412">0%</text>
    <text x="62" y="352">0.5%</text>
    <text x="62" y="282">1.0%</text>
    <text x="62" y="212">1.5%</text>
    <text x="62" y="142">2.0%</text>
  </g>
  <text x="25" y="250" text-anchor="middle" font-size="11" fill="#7F8C8D" transform="rotate(-90,25,250)">访问频率</text>

  <!-- Right Y axis labels (cumulative %) -->
  <g font-size="10" fill="#E74C3C" text-anchor="start">
    <text x="768" y="412">0%</text>
    <text x="768" y="342">20%</text>
    <text x="768" y="272">40%</text>
    <text x="768" y="202">60%</text>
    <text x="768" y="132">80%</text>
    <text x="768" y="72">100%</text>
  </g>
  <text x="790" y="250" text-anchor="middle" font-size="11" fill="#E74C3C" transform="rotate(90,790,250)">累计占比</text>

  <!-- Bars (top 20 experts + long tail) -->
  <!-- X: 70 + i*33, width=28, max freq ~2% at rank 1 -->
  <!-- Y: 410 - (freq/2.0)*340 -->

  <!-- Expert 1: ~2.0% -->
  <rect x="80" y="70"  width="28" height="340" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 2: ~1.8% -->
  <rect x="113" y="104" width="28" height="306" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 3: ~1.65% -->
  <rect x="146" y="130" width="28" height="280" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 4: ~1.5% -->
  <rect x="179" y="155" width="28" height="255" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 5: ~1.4% -->
  <rect x="212" y="172" width="28" height="238" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 6: ~1.3% -->
  <rect x="245" y="189" width="28" height="221" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 7: ~1.2% -->
  <rect x="278" y="206" width="28" height="204" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 8: ~1.15% -->
  <rect x="311" y="214" width="28" height="196" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 9: ~1.1% -->
  <rect x="344" y="223" width="28" height="187" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 10: ~1.05% -->
  <rect x="377" y="231" width="28" height="179" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 11: ~1.0% -->
  <rect x="410" y="240" width="28" height="170" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 12: ~0.95% -->
  <rect x="443" y="248" width="28" height="162" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 13: ~0.9% -->
  <rect x="476" y="257" width="28" height="153" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 14: ~0.85% -->
  <rect x="509" y="265" width="28" height="145" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 15: ~0.8% -->
  <rect x="542" y="274" width="28" height="136" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>
  <!-- Expert 16: ~0.75% -->
  <rect x="575" y="282" width="28" height="128" rx="3" fill="url(#barGrad)" filter="url(#sh)"/>

  <!-- Long tail (small bars) -->
  <rect x="608" y="310" width="28" height="100" rx="3" fill="#AED6F1" filter="url(#sh)"/>
  <rect x="641" y="335" width="28" height="75"  rx="3" fill="#AED6F1" filter="url(#sh)"/>
  <rect x="674" y="355" width="28" height="55"  rx="3" fill="#D5E8F0" filter="url(#sh)"/>
  <rect x="707" y="370" width="28" height="40"  rx="3" fill="#E8F4F8" filter="url(#sh)"/>

  <!-- X axis labels -->
  <g font-size="9" fill="#7F8C8D" text-anchor="middle">
    <text x="94"  y="425">1</text>
    <text x="127" y="425">2</text>
    <text x="160" y="425">3</text>
    <text x="193" y="425">4</text>
    <text x="226" y="425">5</text>
    <text x="259" y="425">6</text>
    <text x="292" y="425">7</text>
    <text x="325" y="425">8</text>
    <text x="358" y="425">9</text>
    <text x="391" y="425">10</text>
    <text x="424" y="425">11</text>
    <text x="457" y="425">12</text>
    <text x="490" y="425">13</text>
    <text x="523" y="425">14</text>
    <text x="556" y="425">15</text>
    <text x="589" y="425">16</text>
    <text x="622" y="425">17-20</text>
    <text x="655" y="425">21-50</text>
    <text x="688" y="425">51-109</text>
    <text x="721" y="425">110-896</text>
  </g>
  <text x="415" y="448" text-anchor="middle" font-size="12" fill="#7F8C8D">专家排名（按频率降序）</text>

  <!-- Cumulative area (right axis) -->
  <!-- 10%→410, 20%→342, 30%→272, ... 90%→104 -->
  <polygon points="
    94,374
    127,342
    160,313
    193,288
    226,265
    259,244
    292,225
    325,208
    358,193
    391,179
    424,166
