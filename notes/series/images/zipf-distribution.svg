  <polyline points="
    94,374
    127,342
    160,313
    193,288
    226,265
    259,244
    292,225
    325,208
    358,193
    391,179
    424,166
    457,154
    490,143
    523,133
    556,124
    589,116
    622,100
    655,82
    688,60
    721,40
  " fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Callouts -->
  <line x1="94" y1="70" x2="130" y2="55" stroke="#2980B9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="130" y="42" width="100" height="22" rx="4" fill="#2980B9"/>
  <text x="180" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Top-1: 2.0%</text>

  <line x1="589" y1="116" x2="620" y2="90" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="620" y="78" width="100" height="22" rx="4" fill="#E74C3C"/>
  <text x="670" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Top-16: ~60%</text>

  <!-- Legend -->
  <rect x="100" y="70" width="150" height="60" rx="6" fill="white" stroke="#BDC3C7" stroke-width="1" filter="url(#sh)"/>
  <rect x="112" y="82" width="12" height="8" rx="2" fill="url(#barGrad)"/>
  <text x="130" y="91" font-size="10" fill="#2C3E50">访问频率</text>
  <line x1="112" y1="103" x2="124" y2="103" stroke="#E74C3C" stroke-width="2"/>
  <text x="130" y="107" font-size="10" fill="#2C3E50">累计占比</text>
  <rect x="112" y="118" width="12" height="8" rx="2" fill="#AED6F1"/>
  <text x="130" y="126" font-size="10" fill="#2C3E50">长尾（冷专家）</text>

  <!-- Key insight -->
  <rect x="540" y="340" width="210" height="60" rx="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" filter="url(#sh)"/>
  <text x="645" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E8449">核心发现</text>
  <text x="555" y="375" font-size="10" fill="#1E8449">• 前 16 专家覆盖 ~60% 请求</text>
  <text x="555" y="390" font-size="10" fill="#1E8449">• 只有 109/896 专家被触及</text>

  <text x="400" y="490" text-anchor="middle" font-size="9" fill="#BDC3C7">数据来源: expert_trace.bin · 100K 条 (layer, expert) 对 · Zipf α=0.279</text>
</svg>
