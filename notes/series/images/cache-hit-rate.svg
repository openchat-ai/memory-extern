<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3498DB" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1ABC9C"/>
    </linearGradient>
    <filter id="sh" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#F8F9FA" rx="10"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">缓存容量 vs 命中率</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#7F8C8D">LRU 策略 · 896 专家 · 100K 请求 · Zipf 分布</text>

  <!-- Axes -->
  <line x1="80" y1="70" x2="80" y2="420" stroke="#BDC3C7" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="760" y2="420" stroke="#BDC3C7" stroke-width="1.5"/>

  <!-- X axis labels (capacity) -->
  <g font-size="10" fill="#7F8C8D" text-anchor="middle">
    <text x="80"  y="438">0</text>
    <text x="166" y="438">1</text>
    <text x="252" y="438">2</text>
    <text x="338" y="438">4</text>
    <text x="424" y="438">8</text>
    <text x="510" y="438">16</text>
    <text x="596" y="438">32</text>
    <text x="682" y="438">64</text>
  </g>
  <text x="420" y="460" text-anchor="middle" font-size="12" fill="#7F8C8D">缓存容量 (GB)</text>

  <!-- Y axis labels (hit rate) -->
  <g font-size="10" fill="#7F8C8D" text-anchor="end">
    <text x="72" y="422">0%</text>
    <text x="72" y="352">10%</text>
    <text x="72" y="282">20%</text>
    <text x="72" y="212">30%</text>
    <text x="72" y="142">40%</text>
    <text x="72" y="72">50%</text>
  </g>
  <text x="30" y="250" text-anchor="middle" font-size="12" fill="#7F8C8D" transform="rotate(-90,30,250)">命中率</text>

  <!-- Grid lines -->
  <g stroke="#ECF0F1" stroke-width="0.8">
    <line x1="80" y1="350" x2="760" y2="350"/>
    <line x1="80" y1="280" x2="760" y2="280"/>
    <line x1="80" y1="210" x2="760" y2="210"/>
    <line x1="80" y1="140" x2="760" y2="140"/>
    <line x1="80" y1="70"  x2="760" y2="70"/>
  </g>

  <!-- Data points (capacity → hit rate, approximated) -->
  <!-- 0GB→0%, 0.5GB→25%, 1GB→35.3%, 2GB→42%, 4GB→52%, 8GB→60%, 16GB→68%, 32GB→78%, 64GB→88% -->
  <!-- X mapping: 80 + (cap/64)*680 -->
  <!-- Y mapping: 420 - (rate/50)*350 -->

  <!-- Area fill -->
  <polygon points="
    80,420
    123,333
    166,296
    252,272
    338,237
    424,210
    510,182
    596,147
    682,92
    760,47
    760,420
  " fill="url(#area)"/>

  <!-- Line -->
  <polyline points="
    80,420
    123,333
    166,296
    252,272
    338,237
    424,210
    510,182
    596,147
    682,92
    760,47
  " fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="166" cy="296" r="5" fill="#2980B9" stroke="white" stroke-width="2"/>
  <circle cx="252" cy="272" r="5" fill="#27AE60" stroke="white" stroke-width="2"/>
  <circle cx="338" cy="237" r="5" fill="#3498DB" stroke="white" stroke-width="2"/>
  <circle cx="424" cy="210" r="5" fill="#3498DB" stroke="white" stroke-width="2"/>
  <circle cx="510" cy="182" r="5" fill="#3498DB" stroke="white" stroke-width="2"/>
  <circle cx="596" cy="147" r="5" fill="#3498DB" stroke="white" stroke-width="2"/>
  <circle cx="682" cy="92"  r="5" fill="#3498DB" stroke="white" stroke-width="2"/>

  <!-- Callout: 1GB = 35.3% -->
  <line x1="166" y1="296" x2="220" y2="260" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="220" y="245" width="120" height="40" rx="6" fill="#E74C3C" filter="url(#sh)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1 GB → 35.3%</text>
  <text x="280" y="278" text-anchor="middle" font-size="9" fill="#FADBD8">最优性价比点</text>

  <!-- Callout: 64GB = 88% -->
  <line x1="682" y1="92" x2="710" y2="65" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="710" y="52" width="75" height="25" rx="5" fill="#7F8C8D"/>
  <text x="747" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="white">64 GB → 88%</text>

  <!-- Legend -->
  <rect x="100" y="80" width="180" height="70" rx="8" fill="white" stroke="#BDC3C7" stroke-width="1" filter="url(#sh)"/>
  <text x="190" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">策略：LRU</text>
  <text x="115" y="118" font-size="10" fill="#5D6D7E">• 专家池：896 个</text>
  <text x="115" y="133" font-size="10" fill="#5D6D7E">• 单专家大小：17.55 MB</text>
  <text x="115" y="148" font-size="10" fill="#5D6D7E">• 路由分布：Zipf (α=0.279)</text>

  <!-- Key insight box -->
  <rect x="540" y="350" width="210" height="65" rx="8" fill="#FFF3CD" stroke="#F39C12" stroke-width="1" filter="url(#sh)"/>
  <text x="645" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">边际收益递减</text>
  <text x="555" y="388" font-size="10" fill="#856404">1→2 GB: +6.7%</text>
  <text x="555" y="403" font-size="10" fill="#856404">2→4 GB: +10%</text>
  <text x="645" y="388" font-size="10" fill="#856404">4→8 GB: +8%</text>
  <text x="645" y="403" font-size="10" fill="#856404">8→16 GB: +8%</text>

  <text x="400" y="490" text-anchor="middle" font-size="9" fill="#BDC3C7">数据来源: hot_expert_cache_sim.py · 100K 真实路由轨迹</text>
</svg>
