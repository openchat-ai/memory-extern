<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="monospace">
  <defs>
    <linearGradient id="codebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="700" height="350" rx="12" fill="url(#codebg)" filter="url(#sh)"/>

  <!-- Title bar -->
  <rect width="700" height="36" rx="12" fill="#313244"/>
  <rect y="12" width="700" height="24" fill="#313244"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="350" y="23" text-anchor="middle" font-size="12" fill="#6c7086">KDA 状态更新 — 核心公式</text>

  <g font-size="14" fill="#cdd6f4">
    <!-- Formula title -->
    <text x="50" y="70" font-size="16" font-weight="bold" fill="#cba6f7">KDA 状态更新</text>
    <text x="50" y="90" font-size="11" fill="#6c7086">Kimi Delta Attention — 替代 softmax KV-cache</text>

    <!-- Formula box -->
    <rect x="40" y="105" width="620" height="50" rx="8" fill="#313244"/>
    <text x="350" y="135" text-anchor="middle" font-size="18" fill="#89b4fa" font-weight="bold">S_t = α · S_{t-1} + β · (k_t ⊗ v_t)</text>

    <!-- Legend -->
    <text x="50" y="185" fill="#f9e2af">α</text><text x="70" y="185" fill="#cdd6f4"> = 衰减因子（控制历史信息保留程度）</text>
    <text x="50" y="208" fill="#f9e2af">β</text><text x="70" y="208" fill="#cdd6f4"> = 门控信号（控制新信息注入强度）</text>
    <text x="50" y="231" fill="#f9e2af">S</text><text x="70" y="231" fill="#cdd6f4"> = 循环状态矩阵（固定大小 d × d）</text>

    <!-- Comparison -->
    <rect x="40" y="255" width="300" height="80" rx="8" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1"/>
    <text x="190" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#f38ba8">传统 softmax</text>
    <text x="55" y="298" font-size="11" fill="#cdd6f4">KV-cache = O(n × d × 2)</text>
    <text x="55" y="318" font-size="11" fill="#f38ba8">100 万 token → 11 TB ❌</text>

    <rect x="360" y="255" width="300" height="80" rx="8" fill="#a6e3a1" fill-opacity="0.1" stroke="#a6e3a1" stroke-width="1"/>
    <text x="510" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#a6e3a1">KDA 循环状态</text>
    <text x="375" y="298" font-size="11" fill="#cdd6f4">循环状态 = O(d × d)</text>
    <text x="375" y="318" font-size="11" fill="#a6e3a1">与序列长度无关 → 几 MB ✅</text>
  </g>
</svg>
